<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Actual-map source for zim-drawn: real geography, pencil-sketched in-browser. Only the sketch is ever shown. -->
  <rect x="0" y="0" width="480" height="360" fill="#e9e1c9"/>
  <!-- graticule -->
  <g stroke="#d3c8a8" stroke-width="1">
    <line x1="0" y1="90" x2="480" y2="90"/>
    <line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="0" y1="270" x2="480" y2="270"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
  </g>
  <!-- neighbours -->
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#a89a78" letter-spacing="3">
    <text x="240" y="22" text-anchor="middle">ZAMBIA</text>
    <text x="30" y="180" text-anchor="middle" transform="rotate(-90 30 180)">BOTSWANA</text>
    <text x="452" y="180" text-anchor="middle" transform="rotate(90 452 180)">MOZAMBIQUE</text>
    <text x="240" y="348" text-anchor="middle">SOUTH AFRICA</text>
  </g>
  <!-- Zimbabwe country polygon (simplified real borders) -->
  <path id="country" d="M 95 55 L 150 50 L 215 60 L 280 45 L 330 50 L 360 70 L 410 110 L 405 160 L 395 210 L 360 260 L 320 300 L 285 310 L 220 305 L 150 295 L 110 280 L 90 220 L 75 160 L 70 100 Z"
    fill="#f5edd5" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lake Kariba -->
  <path d="M 175 62 Q 215 55 255 52 Q 250 62 215 68 Q 185 70 175 62 Z" fill="#9ec5e8" stroke="#2b2620" stroke-width="1.5"/>
  <text x="215" y="80" font-family="sans-serif" font-size="9" font-style="italic" fill="#4a6a8a" text-anchor="middle">Lake Kariba</text>
  <!-- rivers -->
  <g fill="none" stroke="#4a8ac0" stroke-width="2" stroke-dasharray="6 4">
    <path d="M 95 55 Q 180 50 280 45 Q 310 46 330 50"/>
    <path d="M 110 280 Q 200 302 285 310"/>
  </g>
  <g font-family="sans-serif" font-size="9" font-style="italic" fill="#4a6a8a">
    <text x="300" y="38">Zambezi R.</text>
    <text x="190" y="322">Limpopo R.</text>
  </g>
  <!-- roads -->
  <g fill="none" stroke="#8a6a45" stroke-width="1.6" stroke-dasharray="7 4">
    <path d="M 305 100 L 235 185 L 172 232"/><!-- Harare-Gweru-Bulawayo -->
    <path d="M 305 100 L 298 240 L 285 310"/><!-- Harare-Masvingo-Beitbridge -->
    <path d="M 172 232 L 130 125 L 102 62"/><!-- Bulawayo-Hwange-VicFalls -->
    <path d="M 305 100 L 395 165"/><!-- Harare-Mutare -->
  </g>
  <!-- cities -->
  <g font-family="sans-serif" font-size="10" fill="#2b2620">
    <g><rect x="300" y="95" width="10" height="10" fill="#2b2620" transform="rotate(45 305 100)"/><text x="316" y="103" font-weight="bold">Harare ★</text></g>
    <circle cx="172" cy="232" r="3.5" fill="#2b2620"/><text x="180" y="235">Bulawayo</text>
    <circle cx="395" cy="165" r="3.5" fill="#2b2620"/><text x="358" y="182">Mutare</text>
    <circle cx="235" cy="185" r="3" fill="#2b2620"/><text x="242" y="188">Gweru</text>
    <circle cx="298" cy="240" r="3" fill="#2b2620"/><text x="305" y="243">Masvingo</text>
    <circle cx="275" cy="92" r="3" fill="#2b2620"/><text x="282" y="90">Chinhoyi</text>
    <circle cx="285" cy="308" r="3" fill="#2b2620"/><text x="292" y="312">Beitbridge</text>
  </g>
  <text x="240" y="200" font-family="cursive" font-size="26" font-style="italic" fill="#2b2620" opacity="0.7" text-anchor="middle">Zimbabwe</text>
  <!-- attraction markers 1-6 (these get pencil-sketched too) -->
  <g font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <g><circle cx="145" cy="250" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="145" y="254" fill="#fffdf4">1</text><text x="160" y="253" fill="#2b2620" text-anchor="start">Matobo</text></g>
    <g><circle cx="300" cy="245" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="300" y="249" fill="#fffdf4">2</text><text x="315" y="248" fill="#2b2620" text-anchor="start">Great Zim</text></g>
    <g><circle cx="102" cy="62" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="102" y="66" fill="#fffdf4">3</text><text x="117" y="65" fill="#2b2620" text-anchor="start">Vic Falls</text></g>
    <g><circle cx="130" cy="125" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="130" y="129" fill="#fffdf4">4</text><text x="145" y="128" fill="#2b2620" text-anchor="start">Hwange</text></g>
    <g><circle cx="275" cy="85" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="275" y="89" fill="#fffdf4">5</text><text x="275" y="70" fill="#2b2620" text-anchor="middle">Chinhoyi</text></g>
    <g><circle cx="335" cy="62" r="11" fill="#2b2620" stroke="#fffdf4" stroke-width="2"/><text x="335" y="66" fill="#fffdf4">6</text><text x="335" y="47" fill="#2b2620" text-anchor="middle">Mana</text></g>
  </g>
  <text x="240" y="336" font-family="sans-serif" font-size="8" font-style="italic" fill="#7a6f5f" text-anchor="middle">Simplified borders · sketch source, not to survey scale</text>
</svg>
